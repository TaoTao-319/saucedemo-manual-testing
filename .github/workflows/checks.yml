name: Documentation checks
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14.4
      - run: python scripts/check_consistency.py
